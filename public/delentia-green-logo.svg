<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- Inner White Character Card -->
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <rect width="320" height="320" rx="64" fill="#FFFFFF" stroke="#0F172A" stroke-width="14"/>
    
    <!-- Top Green Character Layer with Eyes -->
    <rect x="24" y="32" width="272" height="74" rx="22" fill="#76C455"/>
    <!-- Eyes -->
    <circle cx="106" cy="69" r="15" fill="#221F20"/>
    <circle cx="214" cy="69" r="15" fill="#221F20"/>
    
    <!-- Middle Green Layer -->
    <rect x="24" y="122" width="272" height="70" rx="18" fill="#498F34"/>
    
    <!-- Bottom Green Layer -->
    <rect x="24" y="208" width="272" height="74" rx="18" fill="#2F5A24"/>
  </g>
</svg>
